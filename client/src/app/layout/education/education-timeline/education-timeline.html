<section class="container">
      <ol class="timeline" id="education-timeline">
        <li class="timeline__item" *ngFor="let degree of eduData; let i = index">
          <div class="timeline__marker"></div>
          <div class="timeline__content">
            <p class="timeline__date" data-field="dates">{{degree.date}}</p>
            <h3 class="timeline__degree" data-field="degree">{{degree.degree}}</h3>
            <p class="timeline__school" data-field="school">{{degree.shcool}}</p>
            <p class="timeline__desc" data-field="description">
              {{degree.desc}}
            </p>
          </div>
        </li>
      </ol>
    </section>
